<!DOCTYPE html>
<html lang="es">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>Figuritas</title>

	<link rel="manifest" href="manifest.json">

	<link
		rel="stylesheet"
		href="style.css"
	>

	<meta
		name="theme-color"
		content="#111111"
	>

</head>

<body>

	<div class="container">

		<div class="top-bar">

			<h1>Figuritas Faltantes</h1>

			<div class="input-area">

				<input
					type="text"
					id="figuritaInput"
					placeholder=" "
					autocomplete="off"
				>

				<button id="agregarBtn">
					Agregar
				</button>

			</div>

			<div class="stats">

				Te faltan:
				<span id="contador">0</span>

			</div>

		</div>

		<div class="lista-container">

			<ul id="listaFiguritas"></ul>

		</div>

	</div>

	<div
		id="modalConfirmacion"
		class="modal oculto"
	>

		<div class="modal-contenido">

			<p>
				¿Estas seguro?
			</p>

			<div class="modal-botones">

				<button id="confirmarSi">
					Sí
				</button>

				<button id="confirmarNo">
					No
				</button>

			</div>

		</div>

	</div>

	<script src="storage.js"></script>

	<script src="ui.js"></script>

	<script src="app.js"></script>

</body>
</html>
